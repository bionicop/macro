[package]
edition = "2024"
name = "campaign"
publish = false
version = "0.1.0"

[features]
default = []
# Axum HTTP router.
inbound = [
  "dep:axum",
  "dep:macro_authorization",
  "entity_access/axum",
  "entity_access/inbound",
]
# Agent tools over the campaign service.
ai_tools = ["dep:ai_toolset", "dep:anyhow", "dep:async-trait", "dep:schemars"]
# Postgres persistence for campaigns, their sequence and recipient progress.
postgres = ["dep:entity_access_db_utils", "dep:sqlx"]
# Identity secrets under AWS KMS.
kms = ["dep:aws-sdk-kms"]
# SMTP and SendGrid transports and the outbox over them.
delivery = [
  "dep:mail-builder",
  "dep:reqwest",
  "dep:rustls",
  "dep:tokio",
  "dep:tokio-rustls",
  "dep:webpki-roots",
]

[dependencies]
ai_toolset = { path = "../ai_toolset", optional = true }
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
bot_id = { path = "../bot_id" }
chrono = { workspace = true, features = ["serde"] }
base64 = { workspace = true }
chrono-tz = { workspace = true }
databases = { path = "../databases", default-features = false, features = ["ports"] }
entity_access = { path = "../entity_access", default-features = false, features = ["ports"] }
email_utils = { path = "../email_utils" }
entity_access_db_utils = { path = "../entity_access_db_utils", optional = true }
hmac = { workspace = true }
macro_authorization = { path = "../macro_authorization", optional = true, default-features = false, features = ["axum"] }
macro_user_id = { path = "../macro_user_id" }
macro_uuid = { path = "../macro_uuid" }
mail-builder = { version = "0.4.3", optional = true }
models_databases = { path = "../models_databases" }
models_permissions = { path = "../models_permissions" }
models_properties = { path = "../models_properties" }
reqwest = { workspace = true, optional = true }
rootcause = { workspace = true }
rustls = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["io-util", "net", "time"] }
tokio-rustls = { workspace = true, optional = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
webpki-roots = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
zeroize = { workspace = true }
